<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Life in the UK Test Prep</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
    </head>
    <body class="min-h-screen text-ink">
        <div id="app" class="w-full max-w-xl mx-auto px-4 py-6 sm:py-10">
            <div id="header" class="mb-5 flex flex-col gap-3">
                <h1 class="text-xl font-semibold tracking-tight">
                    Life in the UK Prep
                </h1>
                <div class="flex gap-2 overflow-x-auto -mx-4 px-4 sm:mx-0 sm:px-0">
                    <div
                        class="flex flex-col items-center justify-center flex-1 min-w-[84px] rounded-xl bg-surface border border-line py-2"
                        title="Total questions in the bank"
                    >
                        <div class="text-base font-semibold tabular" id="total-questions">
                            0
                        </div>
                        <div class="text-[11px] text-muted">Bank</div>
                    </div>
                    <div
                        class="flex flex-col items-center justify-center flex-1 min-w-[84px] rounded-xl bg-surface border border-line py-2"
                        title="All-time overall accuracy"
                    >
                        <div class="text-base font-semibold tabular text-accent" id="global-accuracy">
                            0%
                        </div>
                        <div class="text-[11px] text-muted">Accuracy</div>
                    </div>
                    <div
                        class="flex flex-col items-center justify-center flex-1 min-w-[84px] rounded-xl bg-surface border border-line py-2"
                        title="Score on first attempt"
                    >
                        <div class="text-base font-semibold tabular" id="score">
                            0
                        </div>
                        <div class="text-[11px] text-muted">First Try</div>
                    </div>
                </div>
            </div>

            <div class="bg-surface rounded-2xl border border-line p-5 sm:p-7">
                <div id="quiz-container" class="fade-in">
                    <!-- Question rendered here -->
                </div>

                <div id="feedback-container" class="hidden mt-5 pt-5 border-t border-line">
                    <!-- Feedback rendered here -->
                </div>

                <div id="navigation" class="mt-6 flex justify-end">
                    <button
                        id="next-btn"
                        class="hidden w-full sm:w-auto bg-accent hover:bg-accent-dark text-white font-medium text-sm py-3 px-6 rounded-xl transition-colors"
                    >
                        Next Question
                    </button>
                    <button
                        id="restart-btn"
                        class="hidden w-full sm:w-auto bg-ink hover:bg-slate-700 text-white font-medium text-sm py-3 px-6 rounded-xl transition-colors"
                    >
                        Start Again
                    </button>
                </div>
            </div>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
